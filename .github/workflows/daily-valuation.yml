name: Daily analyst valuation scrape

on:
  schedule:
    # 23:10 UTC，週二至週六（對應美股週一至週五收盤後，收盤價與目標價都已更新）
    - cron: "10 23 * * 2-6"
  workflow_dispatch:
    inputs:
      as_of:
        description: "資料基準日 (YYYY-MM-DD)，留空則用今天"
        required: false
        default: ""
      limit:
        description: "只處理前 N 檔（測試用，留空表示全部）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-valuation-scrape
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run valuation scraper
        env:
          # 選用：設定後可取得逐機構目標價，依機構去重後自行計算平均
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # 選用：加入 Finnhub 作為第二個共識來源，未設定則自動略過
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          ARGS="-v"
          if [ -n "${{ github.event.inputs.as_of }}" ]; then
            ARGS="$ARGS --as-of ${{ github.event.inputs.as_of }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python3 scripts/run_valuation.py $ARGS

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/valuation
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: daily analyst valuation data update"
            git pull --rebase origin main
            git push
          fi
