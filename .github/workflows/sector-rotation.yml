name: Sector rotation

# 每個交易日收盤後跑一次。資金流需要相隔一天的兩次觀測，
# 因此排程必須穩定每日執行——漏一天不只少一天的資料，
# 而是讓隔天的資金流變成跨兩天的累計值（程式會標明 days_spanned）。
on:
  schedule:
    - cron: "30 22 * * 1-5"      # 週一至週五 22:30 UTC（美股收盤後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-rotation        # 不可並行：兩個執行同時寫快照會互相覆蓋
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main             # 取 main 最新狀態，避免排隊後 commit 撞衝突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sector rotation
        run: python3 scripts/run_sector_rotation.py -v

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/rotation data/rotation
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: sector rotation update"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "推送失敗，重試 $attempt"
            sleep $((attempt * 3))
          done
          exit 1
