name: Diaper price monitor

on:
  push:
    branches: [main]
    paths:
      - "data/diaper_monitor/manual_prices.csv"
  schedule:
    # 23:00 UTC（台灣時間 07:00），確保就算忘記手動觸發，前一天填好的報價
    # 也會被算進去一次
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "計算基準日 (YYYY-MM-DD)，留空則用今天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: diaper-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run diaper monitor
        run: |
          if [ -n "${{ github.event.inputs.as_of }}" ]; then
            python3 scripts/run_diaper_monitor.py --as-of "${{ github.event.inputs.as_of }}" -v
          else
            python3 scripts/run_diaper_monitor.py -v
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/diaper data/diaper_monitor/history.csv data/diaper_monitor/scraped_prices.csv
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: diaper monitor data update"
            git pull --rebase origin main
            git push
          fi
