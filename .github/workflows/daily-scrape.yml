name: Daily liquidity monitor scrape

on:
  schedule:
    # 22:30 UTC，週一至週五（美股收盤後、各資料源當日數據多已更新）
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "計算基準日 (YYYY-MM-DD)，留空則用今天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-liquidity-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scraper
        run: |
          if [ -n "${{ github.event.inputs.as_of }}" ]; then
            python3 scripts/run_daily.py --as-of "${{ github.event.inputs.as_of }}" -v
          else
            python3 scripts/run_daily.py -v
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: daily liquidity monitor data update"
            # 兩個模組的排程時間相近，先 rebase 避免撞在一起時 push 被拒
            git pull --rebase origin main
            git push
          fi
