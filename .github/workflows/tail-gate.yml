name: Tail fragility gate

# 每個交易日執行。**跨日狀態必須被 commit 回來**——這個模組的計數器存在
# data/tail/state.json，漏推的話下一次執行會從 0 重數，快閘等於永遠不觸發，
# 而且不會報錯（接線說明第 7 節點名的最常見失效模式）。
#
# 排在模組一之後：base_alloc 來自主評分的輸出 docs/data/latest.json，
# 主評分還沒跑完就執行，讀到的會是昨天的部位。
#
# **這件事原本是寫對、做錯的。** 上面這行註解從一開始就在，但 cron 是 21:30，
# 而模組一是 22:30——每天早一個小時，於是 base_alloc 天天是上一個交易日的。
# 實測 2026-08-24 那份報告：as_of 是 08-24，base_alloc 卻來自 08-21，
# 而 problems 是空的。不會失敗、不會留白，只是舊的。
#
# 改到 23:20，並且是量過的：模組一實測 22:46～22:51 開始（排程延遲 16～21 分）、
# 執行約 50 秒，最晚 22:52 前結束。23:20 留下 28 分鐘以上的餘裕，比延遲的
# 變動範圍大得多；同時仍在 UTC 當日之內，兩個模組的 as_of 才會是同一天。
#
# 為什麼這裡用排程、模組九用 workflow_run 綁事件：模組九的輸出**整份**都是
# 模組二的再加工，模組二沒跑就沒有東西好算；模組六不一樣，它自己抓波動率與
# 信用資料，只有 base_alloc 這一項來自模組一。為了模組一失敗就整天不跑，
# 會連帶丟掉那天的跨日狀態累計。因此照常執行，改由 report.py 把
# 「base_alloc 比今天舊」寫進 problems，讓排程再度飄移時看得見。
on:
  schedule:
    - cron: "20 23 * * 1-5"      # 週一至週五 23:20 UTC（美股收盤後，且在模組一之後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tail-gate
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tail fragility gate
        run: python3 scripts/run_tail_gate.py -v

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/tail 一定要包含在內：state.json 漏推等於關閉快閘
          git add docs/data/tail data/tail
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: tail gate update"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "推送失敗，重試 $attempt"
            sleep $((attempt * 3))
          done
          exit 1
