name: US universe crawl

# 全美股約 8000+ 檔，逐檔抓目標價無法在一次執行內跑完（有6小時上限、外部來源也限流）。
# 因此排程分成兩段：
#   1. 每天一次「開新輪」，重建公司清單並把帳本歸零（保留已成功者由 keep_ok 控制）
#   2. 每天多次「續跑」，每次處理一批，由帳本決定還有哪些沒做完
on:
  schedule:
    # 每日 01:10 UTC：重建公司清單並開新一輪
    - cron: "10 1 * * *"
    # 每 3 小時續跑一批（開新輪那次會被上面那條先跑到）
    - cron: "40 4,7,10,13,16,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: true
        default: "continue"
        type: choice
        options: [continue, new_cycle, new_cycle_keep_ok, reset_dead, rebuild_universe]
      max_tickers:
        description: "本次最多處理幾檔"
        required: false
        default: "1500"

permissions:
  contents: write

concurrency:
  group: universe-crawl        # 絕不可並行：兩個執行同時寫帳本會互相覆蓋
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330       # 低於 GitHub 的 360 分上限，留時間 commit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 一定要取 main 的最新狀態，不能用觸發當下的 commit。
          # concurrency 群組會讓後到的執行排隊，等輪到它時 main 早就前進了；
          # 用觸發時的 SHA 等於拿一份過期帳本開始跑，跑完必然 rebase 衝突
          # ——2026-08 就這樣丟掉一整批 1500 檔的進度。
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # 排程觸發：01:10 那班開新輪，其餘續跑
            if [ "${{ github.event.schedule }}" = "10 1 * * *" ]; then
              MODE="new_cycle"
            else
              MODE="continue"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式：$MODE"

      - name: Rebuild company universe
        if: steps.mode.outputs.mode == 'new_cycle' || steps.mode.outputs.mode == 'new_cycle_full' || steps.mode.outputs.mode == 'rebuild_universe'
        run: python3 scripts/build_universe.py -v

      - name: Fetch per-ticker data
        if: steps.mode.outputs.mode != 'rebuild_universe'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          ARGS="-v --max-tickers ${{ github.event.inputs.max_tickers || '1500' }}"
          case "${{ steps.mode.outputs.mode }}" in
            # 每日開新一輪要「全部重抓」。用 --keep-ok 的話，一檔成功之後就
            # 永遠不會再被取用，收盤價、目標價、每股淨值全部凍結在第一次抓到
            # 的那天——掃完一輪之後資料就再也不會更新了。
            new_cycle)          ARGS="$ARGS --new-cycle" ;;
            # 只補跑沒成功的：用於一輪中途想把失敗的補齊，不重抓已完成的
            new_cycle_keep_ok)  ARGS="$ARGS --new-cycle --keep-ok" ;;
            reset_dead)     ARGS="$ARGS --reset-dead" ;;
          esac
          python3 scripts/fetch_universe.py $ARGS

      # 每批跑完就重出報告，儀表板才會隨掃描進度持續更新，而不是等整輪跑完
      - name: Publish dashboard data
        run: python3 scripts/publish_universe.py -v

      # 爬一批要跑十幾分鐘到數小時。這一步失敗就等於整批白做，因此它必須
      # 有能力自己把衝突解掉，而不是把成果丟掉——2026-08 已經因此損失過一批。
      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data/valuation/universe_latest.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: US universe crawl progress"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then
                echo "已推送（第 $attempt 次嘗試）"
                exit 0
              fi
              echo "推送被拒（main 又前進了），重試"
              continue
            fi

            # 進度檔都是以 ticker 為鍵的記錄集合，衝突有唯一正確解：取聯集。
            echo "rebase 衝突，改以記錄層級合併"
            python3 scripts/resolve_crawl_conflict.py || true

            # 衍生檔沒有「合併」的意義：先隨便收下一方讓 rebase 走完，
            # 之後再從合併好的資料重算，確保它與資料一致。
            if git diff --name-only --diff-filter=U | grep -q universe_latest.json; then
              git checkout --theirs docs/data/valuation/universe_latest.json 2>/dev/null \
                || git checkout --ours docs/data/valuation/universe_latest.json
              git add docs/data/valuation/universe_latest.json
            fi

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "仍有無法自動合併的檔案，停止並保留現場（不會丟掉已抓到的資料）"
              git diff --name-only --diff-filter=U
              git rebase --abort
              exit 1
            fi

            GIT_EDITOR=true git rebase --continue || git rebase --skip || exit 1

            # 資料經過合併，衍生檔必須依合併後的結果重算，否則儀表板與帳本對不上
            python3 scripts/publish_universe.py
            git add docs/data/valuation/universe_latest.json
            git diff --cached --quiet || git commit --amend --no-edit
          done

          echo "重試 5 次仍無法推送"
          exit 1
