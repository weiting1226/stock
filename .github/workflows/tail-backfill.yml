name: Tail gate backfill

# 手動觸發。回補是一次性的重建，不是每天要做的事——排程它只會每天把同一段
# 歷史重算一次，並且每次都覆寫日誌裡的 backfill 列。
on:
  workflow_dispatch:
    inputs:
      start:
        description: "回補起日（YYYY-MM-DD，留空用分數歷史的起點）"
        required: false
        default: ""
      dry_run:
        description: "只算不寫檔"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: tail-gate          # 與每日執行共用：兩者都會寫 data/tail/daily_log.csv
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill
        run: |
          python3 scripts/backfill_tail_gate.py -v \
            ${{ inputs.start && format('--start {0}', inputs.start) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit results
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/tail data/tail
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: tail gate backfill"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "推送失敗，重試 $attempt"
            sleep $((attempt * 3))
          done
          exit 1
